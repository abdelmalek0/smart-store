name: native_rknn
description: Native RKNN Runtime bindings for Flutter (Dart FFI only, no platform plugins)
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  ffi: ^2.0.0
  path: ^1.8.0
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.example.native_rknn
        pluginClass: NativeRknnPlugin
