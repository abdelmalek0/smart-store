plugins {
    id 'com.android.library'
}

android {
    namespace 'com.example.native_rknn'
    compileSdk 34
    
    defaultConfig {
        minSdk 21
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
    
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}
